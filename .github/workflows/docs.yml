# Documentation site: MkDocs Material from docs/ -> GitHub Pages, with the
# interactive graph demo (obsidience/ui/demo, built by Vite) at /demo/.
# Pull requests build with --strict; pushes to main build and deploy.
# Actions are pinned to full commit SHAs (tag in the trailing comment).
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "obsidience/ui/**"
      - "mkdocs.yml"
      - "obsidience/defaults/vault/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "obsidience/ui/**"
      - "mkdocs.yml"
      - "obsidience/defaults/vault/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install MkDocs
        run: python -m pip install -r docs/requirements.txt
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.8.1
          package_json_file: obsidience/ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: obsidience/ui/pnpm-lock.yaml
      - name: Build the graph demo
        run: |
          pnpm --dir obsidience/ui install --frozen-lockfile
          pnpm --dir obsidience/ui build:demo
      - name: Build (strict)
        run: mkdocs build --strict
      - name: Add the graph demo at /demo/
        run: cp -r obsidience/ui/out/demo site/demo
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
