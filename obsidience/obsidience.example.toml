# Copy to obsidience/obsidience.toml and configure this installation.
# The real file is ignored; do not store credentials in the example.
llm_model = "obsidience-gemma"
git_commit = true  # Local Vault audit only; never the application repository.
# vault_dir = "/absolute/path/to/your/local/vault"
# db_path = "/absolute/path/to/your/local/state/obsidience.sqlite3"
# Speech endpointing: Smart Turn v3.2 judges each pause (CPU); false restores
# the fixed 700 ms pause. A model that fails to load also falls back to it.
# realtime_smart_turn = true
# "bundled" selects Pipecat's bundled Smart Turn v3.1 instead of v3.2.
# realtime_smart_turn_model = "bundled"
# Complete short replies ("yes", "no", "never mind") end the turn at the
# model's verdict even when it scores them incomplete; false waits as usual.
# realtime_short_replies = true
# Executive voice turns speak claim-checked sentences before completion
# acceptance, appended to one worker reply with a short pause between sentences;
# false speaks only the accepted reply.
# realtime_early_speech = true
# Desktop ASR skips GPU steps 0.7 s after VAD speech or the last recognized word;
# each VAD onset replays its 320 ms pre-roll. false runs ASR continuously.
# realtime_asr_silence_gate = true
# ADK model route: "local" streams from llama-server over the Harness's httpx
# pool; "litellm" restores ADK's LiteLlm route (same requests, more CPU).
# adk_model_client = "local"
# Wake mode: a CPU keyword spotter hears "Computer" ~0.2 s after it is spoken
# and, at a segment start, chirps and interrupts before ASR text arrives; ASR
# text still opens the command window. false keeps ASR-only wake detection.
# realtime_wake_spotter = true
# Contextual speech admission: the Executive judges whether an utterance is
# complete in the same request that drafts its first response, speculated at
# speech pauses (DESIGN.md, "Contextual speech admission"). Off by default.
# realtime_semantic_turns = true
# Early final: at Silero's 200 ms pause the ASR worker decodes the tail once more
# and sends the words as a pause edge for speculative admission. Off by default.
# realtime_asr_early_final = true
# Owner speech over a reply ducks it, holds it once speech continues and resumes
# it after a false alarm; false stops playback on speech onset instead.
# realtime_barge_in_ducking = true
# Pocket TTS voices replies with dynamic int8 weights in its FlowLM (CPU, less
# memory, same voice file); read at speech worker start. Off by default (fp32).
# realtime_tts_quantize = true
# Optional providers (TOML tables; keep them after the top-level keys above).
# Hindsight historical memory: leave unset until its service is configured
# (obsidience/harness/memory/README.md).
# [memory]
# hindsight_url = "http://127.0.0.1:8790"
# Local SearXNG for web.search; without it web.search uses its DDGS fallback.
# [web]
# searxng_url = "http://127.0.0.1:8888"
