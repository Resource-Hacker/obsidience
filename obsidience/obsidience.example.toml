# Copy to obsidience/obsidience.toml and configure this installation.
# The real file is ignored; do not store credentials in the example.
llm_base_url = "http://127.0.0.1:8089/v1"
llm_model = "obsidience-gemma"
git_commit = true  # Local Vault audit only; never the application repository.
# vault_dir = "/absolute/path/to/your/local/vault"
# db_path = "/absolute/path/to/your/local/state/obsidience.sqlite3"
# Speech endpointing: Smart Turn v3.2 judges each pause (CPU); false restores
# the fixed 700 ms pause. A model that fails to load also falls back to it.
# realtime_smart_turn = true
# "bundled" selects Pipecat's bundled Smart Turn v3.1 instead of v3.2.
# realtime_smart_turn_model = "bundled"
# Complete short replies ("yes", "no", "never mind") end the turn at the
# model's verdict even when it scores them incomplete; false waits as usual.
# realtime_short_replies = true
