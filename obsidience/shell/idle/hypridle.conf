# Obsidience session lock and display-idle policy. Hypridle only triggers the
# upstream lock and DPMS capabilities; it never owns authentication or sleep.

general {
    lock_cmd = /usr/bin/qs ipc --path /home/wissenschafter/Projects/obsidience/obsidience/shell/qml --any-display call lock lock
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
    inhibit_sleep = 0
}

listener {
    timeout = 300
    ignore_inhibit = true
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    ignore_inhibit = true
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
