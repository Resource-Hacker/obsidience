# The Harness launches Wayland capture clients. Start it only after UWSM
# has exported the compositor environment, not at user-manager startup.
[Unit]
After=graphical-session.target
PartOf=graphical-session.target

# Migrate the existing default.target enablement with `systemctl --user
# reenable obsidience-harness-dev.service` after installing this drop-in.
# The Shell session already Wants the same Harness; no second service.
[Install]
WantedBy=
WantedBy=obsidience-shell-session.target
