# Obsidience TV session: a headless compositor that holds only TV content.
# Sunshine connects to this compositor, so it can never capture the desktop session.
output HEADLESS-1 resolution 1920x1080@60Hz position 0 0
default_border none
default_floating_border none
focus_follows_mouse no
seat * hide_cursor 1000
for_window [app_id=".*"] fullscreen enable
for_window [class=".*"] fullscreen enable
# The player and Sunshine units read this compositor's socket name from here.
exec sh -c 'printf %s "$WAYLAND_DISPLAY" > "$XDG_RUNTIME_DIR/obsidience-tv/wayland"'
