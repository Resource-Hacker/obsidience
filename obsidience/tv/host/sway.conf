# Obsidience TV session: a headless compositor that holds only TV content.
# Sunshine connects to this compositor, so it can never capture the desktop session.
output HEADLESS-1 resolution 3840x2160@60Hz position 0 0
default_border none
default_floating_border none
focus_follows_mouse no
seat * hide_cursor 1000
for_window [app_id=".*"] fullscreen enable
for_window [class=".*"] fullscreen enable
# One workspace per source, and the television shows one of them (tv/host/show): the channel
# player with its break view, or the Android TV instance. sway keeps one fullscreen window per
# workspace and tiles the others, which would resize Android's display; and a window that starts
# while the other source shows must not open over it. The first workspace listed is the one the
# session starts on.
workspace player output HEADLESS-1
workspace android output HEADLESS-1
assign [app_id="obsidience-tv-player"] workspace player
assign [app_id="obsidience-tv-break"] workspace player
assign [app_id="Waydroid"] workspace android
# The player and Sunshine units read this compositor's socket name from here.
exec sh -c 'printf %s "$WAYLAND_DISPLAY" > "$XDG_RUNTIME_DIR/obsidience-tv/wayland"'
# show reads this compositor's control socket from here.
exec sh -c 'printf %s "$SWAYSOCK" > "$XDG_RUNTIME_DIR/obsidience-tv/sway"'
