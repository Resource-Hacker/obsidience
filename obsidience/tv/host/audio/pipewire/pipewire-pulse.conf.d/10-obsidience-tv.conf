# Obsidience TV private audio server, PulseAudio side (Sunshine's capture).
pulse.properties = {
    # Sunshine asks for one Opus frame (5 ms) per fragment; let it have that.
    pulse.min.frag    = 240/48000
    pulse.min.req     = 240/48000
    pulse.min.quantum = 240/48000
}
# The always-present sink the player uses when no stream is connected.
pulse.cmd = [
    { cmd = "load-module" args = "module-null-sink sink_name=obsidience_tv sink_properties=device.description=Obsidience-TV rate=48000 channels=2" flags = [ ] }
]
