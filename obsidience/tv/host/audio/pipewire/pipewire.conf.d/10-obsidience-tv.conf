# Obsidience TV private audio server. This directory is the server's whole user
# configuration: the desktop's drop-ins in ~/.config/pipewire must not apply here
# (their 43 ms "stable audio" buffers made the TV's sound stutter, 2026-10-12).
context.properties = {
    # One Opus frame (5 ms) per graph cycle, so Sunshine sends audio evenly.
    default.clock.rate        = 48000
    default.clock.quantum     = 240
    default.clock.min-quantum = 240
    default.clock.max-quantum = 240
}
