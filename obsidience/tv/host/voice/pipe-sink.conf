# Obsidience TV voice: the PipeWire sink that Snapcast plays (obsidience-tv-voice-sink.service).
# A small PipeWire client that offers the sink obsidience_tv_voice and writes what plays into it,
# as raw 48 kHz 16-bit stereo, to the pipe the Snapcast server reads. Snapcast's own PipeWire
# input was used first and went silent twice after running for a while (clients connected,
# "no chunks available"); its pipe input is the old, proven one.
context.properties = {
    log.level = 2
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-pipe-tunnel
        args = {
            tunnel.mode = sink
            pipe.filename = "/run/user/1000/obsidience-tv/voice.fifo"
            audio.format = S16LE
            audio.rate = 48000
            audio.channels = 2
            audio.position = [ FL FR ]
            stream.props = {
                node.name = obsidience_tv_voice
                node.description = "Executive voice (Snapcast)"
            }
        }
    }
]
