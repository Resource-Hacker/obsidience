# Obsidience TV voice: the Snapcast server that plays the Executive's voice on the desk speakers
# and on the television at the same instant (owner, 2026-10-12). Each client plays every chunk
# at the server's time plus `buffer`, and keeps correcting its own clock and drift.
[server]
datadir = /home/wissenschafter/.local/state/obsidience-tv/snapserver

[http]
# No web interface.
enabled = false

[tcp-control]
# JSON-RPC: the voice router on this workstation, and the television's Snapcast app, whose
# screen will not leave "connecting" without it. The firewall admits only the television.
enabled = true
bind_to_address = 0.0.0.0
port = 1705
publish = true

[tcp-streaming]
enabled = true
bind_to_address = 0.0.0.0
port = 1704
publish = true

[stream]
# What plays into the PipeWire sink obsidience_tv_voice (obsidience-tv-voice-sink.service) arrives
# on this pipe. Uncompressed: the television is on the local network and a codec only adds delay.
source = pipe:///run/user/1000/obsidience-tv/voice.fifo?name=obsidience_tv_voice&mode=read
sampleformat = 48000:16:2
codec = pcm
chunk_ms = 20
# End-to-end delay of the voice while it takes this route, in ms. 300 is what the owner judged
# in step by ear; the television then plays 46 ms behind the desk speakers at the desk
# microphone, steady to 2 ms (2026-10-12).
buffer = 300

[logging]
sink = stdout
filter = *:notice
