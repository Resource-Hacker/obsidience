# Obsidience TV stream: Sunshine sees only the TV session's single headless output.
# Audio: on the TV's private audio server Sunshine makes its own sink the default
# while a stream runs and captures it; the player follows that server's default.
# Capture and HEVC encode run on the RTX 4080 that renders the TV session (the unit
# pins CUDA to it); the model GPU is never used. Credentials and paired clients stay
# in ~/.config/sunshine.
sunshine_name = Obsidience
capture = wlr
encoder = nvenc
adapter_name = /dev/dri/by-path/pci-0000:01:00.0-render
file_apps = /home/wissenschafter/Projects/obsidience/obsidience/tv/host/apps.json
# The TV remote must never reach the workstation through virtual input devices.
keyboard = disabled
mouse = disabled
controller = disabled
upnp = off
origin_web_ui_allowed = pc
system_tray = disabled
min_log_level = info
