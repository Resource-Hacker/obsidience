# Obsidience CPU policy (2026-10-28): the TV stack (tuner, player, sway session, Sunshine, its own
# PipeWire) leaves the voice cores 8-11,24-27 to the speech worker and runs on 12-15,28-31, where it
# outweighs obsidience-workers.slice (app.slice 100 vs 20). Sorts after the shared
# obsidience-tv-.service.d/30-ccd1.conf (8-15,24-31), so this value wins.
[Service]
AllowedCPUs=12-15,28-31
